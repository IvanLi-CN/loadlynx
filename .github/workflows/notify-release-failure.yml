name: Notify failed release

on:
  workflow_run:
    workflows:
      - Release (LoadLynx)
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write

jobs:
  notify_failure:
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure' }}
    uses: IvanLi-CN/oidrune/.github/workflows/notify.yml@e48822f99c6402a753ed86557ea029754cbab20b
    with:
      outcome: failure
      summary: |
        Project: LoadLynx
        Status: failure
        Result: failure
        Target SHA: ${{ github.event.workflow_run.head_sha }}
        Run URL: ${{ github.event.workflow_run.html_url }}
        Failure title: Release (LoadLynx) failed
        Workflow: ${{ github.event.workflow_run.name }}
        Branch: ${{ github.event.workflow_run.head_branch || 'unknown' }}
        Run attempt: ${{ github.event.workflow_run.run_attempt }}
        Actor: ${{ github.event.workflow_run.triggering_actor.login || github.event.workflow_run.actor.login || github.actor }}
        Event: ${{ github.event.workflow_run.event }}
        Release context: Release workflow owns PR label release intent; inspect the failed run summary for type/channel/version context.

  smoke_test:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    uses: IvanLi-CN/oidrune/.github/workflows/notify.yml@e48822f99c6402a753ed86557ea029754cbab20b
    with:
      outcome: failure
      summary: |
        Project: LoadLynx
        Status: failure
        Result: failure
        Target SHA: ${{ github.sha }}
        Run URL: ${{ format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
        Smoke title: Release failure notification smoke test
        Workflow: Notify failed release
        Branch: ${{ github.ref_name }}
        Run attempt: ${{ github.run_attempt }}
        Actor: ${{ github.actor }}
        Event: workflow_dispatch
        Smoke context: manual notifier smoke test
